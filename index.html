<style>
:root{--bg:#f6f3ea;--card:#fff;--tx:#1d2b24;--mu:#6b7a72;--pr:#1f6b4f;--ac:#b8892b;--bd:#e4dfd0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10181400;--bg:#101814;--card:#18241e;--tx:#e8efe9;--mu:#92a39a;--pr:#3fa57e;--ac:#d9aa4a;--bd:#2a3a32}}
:root[data-theme="dark"]{--bg:#101814;--card:#18241e;--tx:#e8efe9;--mu:#92a39a;--pr:#3fa57e;--ac:#d9aa4a;--bd:#2a3a32}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,sans-serif;max-width:560px;margin-inline:auto;padding-bottom:80px;line-height:1.6}
h1{font-size:20px;margin:0}h2{font-size:16px;margin:0 0 8px}
header{padding:16px;display:flex;justify-content:space-between;align-items:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:10px 12px}
.verse{background:linear-gradient(135deg,var(--pr),#14442f);color:#fff;border:0}
.verse .a{font-family:"Amiri","Noto Naskh Arabic",serif;font-size:22px;line-height:2;text-align:center}
.verse .r{font-size:12px;opacity:.85;text-align:center}
.big{font-size:30px;font-weight:700;color:var(--pr)}
.mu{color:var(--mu);font-size:13px}
button{font:inherit;border:0;border-radius:10px;padding:8px 14px;background:var(--pr);color:#fff;cursor:pointer}
button.s{background:transparent;color:var(--pr);border:1px solid var(--pr)}
button.g{background:transparent;color:var(--mu);padding:4px 8px}
input,select{font:inherit;padding:8px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);max-width:100%}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.it{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.done{text-decoration:line-through;color:var(--mu)}
.chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--pr);background:none;padding:0;color:#fff}
.chk.on{background:var(--pr)}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--card);border-top:1px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:10px 2px;font-size:12px}
nav button.on{color:var(--pr);font-weight:700}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ac)}
.warn{background:#b8892b22;border:1px solid var(--ac);border-radius:10px;padding:8px;margin-top:8px}
:root{--bg:#f4efe3;--card:#fffdf8;--tx:#17251f;--mu:#78857d;--pr:#0f5c43;--pr2:#1b8a65;--ac:#c19a3e;--bd:#ebe3cf;--sh:0 8px 28px -12px rgba(15,60,43,.25)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a110e;--card:#121d17;--tx:#eef3ee;--mu:#8da096;--pr:#2fae80;--pr2:#1b8a65;--ac:#e0b858;--bd:#1f2e26;--sh:0 8px 28px -12px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{--bg:#0a110e;--card:#121d17;--tx:#eef3ee;--mu:#8da096;--pr:#2fae80;--pr2:#1b8a65;--ac:#e0b858;--bd:#1f2e26;--sh:0 8px 28px -12px rgba(0,0,0,.6)}
body{font-family:Tajawal,"Segoe UI",Tahoma,system-ui,sans-serif;background:radial-gradient(900px 400px at 100% -10%,rgba(193,154,62,.14),transparent 60%),var(--bg)}
header{padding:22px 18px 8px}
h1{font-size:26px;font-weight:800;letter-spacing:.5px}
h1 span{background:linear-gradient(90deg,var(--ac),var(--pr2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;font-weight:700;color:var(--pr)}
.card{border-radius:22px;padding:18px;margin:12px 14px;box-shadow:var(--sh);animation:up .5s both}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:nth-child(2){animation-delay:.06s}.card:nth-child(3){animation-delay:.12s}.card:nth-child(4){animation-delay:.18s}
.verse{position:relative;overflow:hidden;background:linear-gradient(145deg,#0b4a35,#0f5c43 55%,#157a58);border:1px solid rgba(224,184,88,.45);padding:26px 18px}
.verse:before{content:"";position:absolute;inset:0;opacity:.09;background:repeating-conic-gradient(from 0deg at 50% 50%,#fff 0 6deg,transparent 6deg 30deg);mask:radial-gradient(circle at 50% 50%,#000,transparent 70%);-webkit-mask:radial-gradient(circle at 50% 50%,#000,transparent 70%)}
.verse>*{position:relative}
.verse .a{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:25px;line-height:2.1;color:#fff7e0}
.verse .r{color:#e0b858;opacity:1;letter-spacing:1px;margin-top:4px}
.verse button{border-radius:20px;font-size:13px;background:rgba(255,255,255,.12)!important;border:1px solid rgba(224,184,88,.6)!important;color:#fff7e0!important}
.hero{display:flex;align-items:center;gap:16px}
.hero .big{font-size:26px;font-weight:800;color:var(--tx)}
.ring{width:92px;height:92px;flex:none;position:relative}
.ring svg{transform:rotate(90deg) scaleX(-1)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:18px;color:var(--pr)}
button{background:linear-gradient(135deg,var(--pr2),var(--pr));border-radius:14px;padding:10px 18px;font-weight:700;box-shadow:0 6px 16px -8px var(--pr);transition:transform .15s}
button:active{transform:scale(.95)}
button.s{background:transparent;box-shadow:none;border:1.5px solid var(--pr);color:var(--pr)}
button.g{background:none;box-shadow:none;color:var(--mu)}
.chk{width:30px;height:30px;box-shadow:none;border:2px solid var(--ac);padding:0}
.chk.on{background:linear-gradient(135deg,var(--ac),#9a7420);border-color:var(--ac)}
input,select{border-radius:14px;padding:11px 12px;background:var(--bg);border:1.5px solid var(--bd)}
input:focus,select:focus{outline:0;border-color:var(--ac)}
.it{padding:12px 0}
.bar{height:10px;background:var(--bd)}.bar i{background:linear-gradient(90deg,var(--ac),var(--pr2));border-radius:6px;transition:width .5s}
.warn{border-radius:14px;background:rgba(193,154,62,.14)}
nav{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:532px;border:1px solid var(--bd);border-radius:26px;padding:6px;box-shadow:0 14px 34px -10px rgba(0,0,0,.35);background:color-mix(in srgb,var(--card) 85%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
nav button{border-radius:20px;font-size:11px;padding:9px 0;box-shadow:none;background:none;font-weight:500;color:var(--mu)}
nav button.on{background:linear-gradient(135deg,var(--pr2),var(--pr));color:#fff}
body{padding-bottom:110px}
nav button{display:flex;flex-direction:column;align-items:center;gap:3px}
body:before{content:"";position:fixed;left:0;right:0;top:0;height:400px;background:var(--sky,none);opacity:.38;z-index:-1;pointer-events:none;-webkit-mask:linear-gradient(#000,transparent);mask:linear-gradient(#000,transparent)}
#sp{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;text-align:center;padding:28px;color:#fff7e0;transition:opacity .5s;background:radial-gradient(circle at 50% 30%,rgba(224,184,88,.2),transparent 60%),linear-gradient(160deg,#08382a,#0f5c43 60%,#157a58)}
#sp.out{opacity:0}
.spi .a{font-family:Amiri,"Noto Naskh Arabic",serif;font-size:30px;line-height:2.2;animation:up .9s both}
.sg{color:#e0b858;font-size:18px;margin-bottom:18px;letter-spacing:1px}
.spi .r{color:#e0b858;margin:6px 0 30px}
#toast{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:14px;right:14px;max-width:532px;margin:auto;z-index:60;background:var(--pr);color:#fff;padding:14px 16px;border-radius:16px;border:1px solid var(--ac);box-shadow:var(--sh);transform:translateY(-160%);transition:transform .4s}
#toast.show{transform:none}
.spi button{background:rgba(255,255,255,.12);border:1px solid rgba(224,184,88,.7);color:#fff7e0;box-shadow:none;padding:12px 30px;border-radius:24px}
</style>

function times(date){
 const r=Math.PI/180,tz=-date.getTimezoneOffset()/60,{lat,lng}=S.loc;
 const D=Date.UTC(date.getFullYear(),date.getMonth(),date.getDate())/864e5+2440587.5-2451545;
 const g=((357.529+.98560028*D)%360)*r,q=(280.459+.98564736*D)%360;
 const L=((q+1.915*Math.sin(g)+.02*Math.sin(2*g))%360)*r,e=(23.439-4e-7*D)*r;
 let RA=Math.atan2(Math.cos(e)*Math.sin(L),Math.cos(L))/r/15;RA=((RA%24)+24)%24;
 const dec=Math.asin(Math.sin(e)*Math.sin(L));let eq=q/15-RA;eq=((eq+12)%24+24)%24-12;
 const noon=12+tz-lng/15-eq,la=lat*r;
 const H=a=>Math.acos((Math.sin(a*r)-Math.sin(la)*Math.sin(dec))/(Math.cos(la)*Math.cos(dec)))/r/15;
 const asrA=Math.atan(1/(1+Math.tan(Math.abs(la-dec))))/r;
 const h={fajr:noon-H(-19.5),dhuhr:noon+.04,asr:noon+H(asrA),maghrib:noon+H(-.833)+.02,isha:noon+H(-17.5)};
 const o={};for(const k in h){const d=new Date(date.getFullYear(),date.getMonth(),date.getDate());d.setMinutes(Math.round(h[k]*60));o[k]=d}return o}

if(Math.round((n-t.fajr)/6e4)==30)ev.push(['am','وقت أذكار الصباح']);if(Math.round((n-t.asr)/6e4)==30)ev.push(['pm','وقت أذكار المساء']);
for(const[i,m]of ev){const f=i+key();if(!fired.has(f)){fired.add(f);notify(m)}}}
setInterval(checkN,20000);
let sdoc=null,stm=null;
function push(){clearTimeout(stm);stm=setTimeout(()=>{try{sdoc&&sdoc.set({ts:S.ts,json:JSON.stringify(S)}).catch(()=>{})}catch(e){}},1500)}
